name: Dependency Update Check

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Check for outdated dependencies
        id: outdated
        run: |
          echo "## Outdated dependencies" > outdated-report.md
          echo "" >> outdated-report.md

          # Capture outdated output; npm outdated exits non-zero when updates exist
          if npm outdated --long 2>/dev/null | tee outdated-raw.txt; then
            echo "No outdated dependencies found."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_updates=true" >> "$GITHUB_OUTPUT"

          echo '```' >> outdated-report.md
          cat outdated-raw.txt >> outdated-report.md
          echo '```' >> outdated-report.md

      - name: Update dependencies
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          npm update
          npm update --save

      - name: Build check
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          npx papi
          npm run build
        env:
          VITE_SUBSCAN_API_KEY: ${{ secrets.SUBSCAN_API_KEY }}

      - name: Create Pull Request
        if: steps.outdated.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update npm dependencies"
          title: "chore(deps): update npm dependencies"
          body-path: outdated-report.md
          branch: chore/dependency-updates
          delete-branch: true
          labels: dependencies
