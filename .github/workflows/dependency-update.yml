name: Dependency Update

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Check for updates
        id: check-updates
        run: |
          # Run npm-check-updates and save output
          ncu_output=$(ncu --jsonUpgraded)

          # Check if there are any updates
          if [ "$ncu_output" = "{}" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates available:"
            ncu

            # Save update details for PR body
            echo 'update_details<<EOF' >> $GITHUB_OUTPUT
            ncu >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          fi

      - name: Update dependencies
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          # Update package.json with latest versions
          ncu -u

          # Update lockfile
          yarn install

      - name: Create Pull Request
        if: steps.check-updates.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies to latest versions'
          title: 'chore(deps): Update dependencies'
          body: |
            ## Dependency Updates

            This PR updates dependencies to their latest versions.

            ### Updated Packages

            ```
            ${{ steps.check-updates.outputs.update_details }}
            ```

            ### Notes
            - This PR was automatically generated by the dependency update workflow
            - Please review the changes and test thoroughly before merging
            - Check the changelog of each updated package for breaking changes

            ---
            *Generated by [dependency-update.yml](../.github/workflows/dependency-update.yml)*
          branch: chore/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
